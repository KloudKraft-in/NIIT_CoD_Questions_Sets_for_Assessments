# Load Balancer / Reverse Proxy Configuration
server {
    listen 80;
    server_name portal.enterprise.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portal.enterprise.com;

    ssl_certificate /etc/ssl/certs/portal.crt;
    ssl_certificate_key /etc/ssl/private/portal.key;

    location / {
        proxy_pass http://10.0.10.50:8080;
        proxy_set_header Host $host;
        # NOTE: X-Forwarded-Proto header is currently missing
    }
}
