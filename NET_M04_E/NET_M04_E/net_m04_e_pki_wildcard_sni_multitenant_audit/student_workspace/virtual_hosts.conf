# NGINX Multi-Tenant Virtual Host Configuration
server {
    listen 443 ssl default_server;
    server_name default-fallback.enterprise.com;
    ssl_certificate /etc/ssl/certs/default.crt;
    ssl_certificate_key /etc/ssl/private/default.key;
}

server {
    listen 443 ssl;
    server_name ~^(?<subdomain>.+)\.app\.enterprise\.com$;
    ssl_certificate /etc/ssl/certs/wildcard_enterprise.crt; # Contains CN=*.enterprise.com
    ssl_certificate_key /etc/ssl/private/wildcard_enterprise.key;
}
